<ion-content [fullscreen]="true" class="home-content">
  <div class="home">
    <div class="home-media" aria-hidden="true">
      <img
        src="assets/game/hero-fisioactiv.png"
        alt=""
        class="home-photo"
      />
      <div class="home-scrim"></div>
    </div>

    <div class="home-content-layer">
      <header class="home-nav">
        <span class="nav-dot" aria-hidden="true"></span>
        <span class="nav-label">FisioActiv</span>
      </header>

      <section class="home-hero">
        <p class="brand">FisioActiv</p>
        <h1>Mueve el cuerpo.<br />Gana el juego.</h1>
        <p class="lead">
          Terapia física con cámara: alcanza y revienta globos con tus manos en tiempo real.
        </p>
        <a routerLink="/game" class="cta fa-cta">Comenzar sesión</a>
      </section>
    </div>
  </div>
</ion-content>
