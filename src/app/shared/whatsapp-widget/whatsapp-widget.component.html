@if (!hidden) {
  <div class="wa-root">
    @if (open) {
      <div class="wa-panel fa-panel" role="dialog" aria-label="Mensaje de soporte">
        <div class="wa-panel-head">
          <strong>Soporte</strong>
          <button type="button" class="wa-close" (click)="closePanel()" aria-label="Cerrar">×</button>
        </div>
        <p class="wa-hint">Déjanos tu número y mensaje. Te contactaremos pronto.</p>
        <label class="wa-field">
          <span>Tu teléfono</span>
          <input
            type="tel"
            [(ngModel)]="phone"
            placeholder="Ej. 912086409"
            autocomplete="tel"
            [disabled]="loading"
          />
        </label>
        <label class="wa-field">
          <span>Mensaje</span>
          <textarea
            [(ngModel)]="message"
            rows="3"
            placeholder="¿En qué te ayudamos?"
            [disabled]="loading"
          ></textarea>
        </label>

        @if (errorMessage) {
          <p class="wa-error">{{ errorMessage }}</p>
        }

        <button
          type="button"
          class="fa-cta wa-send"
          [disabled]="loading || !phone.trim() || !message.trim()"
          (click)="submit()"
        >
          {{ loading ? 'Enviando…' : 'Enviar' }}
        </button>
      </div>
    }

    @if (successOpen) {
      <div class="wa-success fa-panel" role="status">
        <p>
          Mensaje enviado. El equipo de soporte te contactará pronto.
        </p>
        <button type="button" class="wa-ok" (click)="dismissSuccess()">Entendido</button>
      </div>
    }

    <button
      type="button"
      class="wa-fab"
      (click)="toggle()"
      aria-label="Enviar mensaje de soporte"
      title="Soporte"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true" width="28" height="28">
        <path
          fill="#fff"
          d="M16.1 3C9.5 3 4.1 8.3 4.1 14.8c0 2.1.6 4.1 1.6 5.9L4 28l7.5-1.9c1.7.9 3.6 1.4 5.5 1.4 6.6 0 11.9-5.3 11.9-11.9S22.6 3 16.1 3zm0 21.7c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-4.4 1.1 1.2-4.3-.2-.3c-1-1.5-1.5-3.2-1.5-5 0-5.3 4.3-9.6 9.6-9.6s9.6 4.3 9.6 9.6-4.3 10-9.2 10zm5.3-7.2c-.3-.1-1.7-.8-2-.9s-.5-.1-.7.1c-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.8-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4 0-.1-.2-.2-.5-.3z"
        />
      </svg>
    </button>
  </div>
}
