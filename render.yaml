# Render Blueprint — Static Site FisioActiv
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fisioactiv
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: www
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
